# H2 em memória — evita dependência do banco Supabase durante testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=value
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria o schema a partir das entidades (migrations do Flyway são PostgreSQL-específicas)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway desabilitado: as migrations usam SQL específico do PostgreSQL
spring.flyway.enabled=false

# CORS
cors.allowed-origins=http://localhost:5173

# JWKS — JWT decoder é lazy; qualquer URI válida funciona para subir o contexto
supabase.project-id=test
