spring.profiles.active=dev
# Application
spring.application.name=softlanches-backend
server.port=8080

# JPA — ddl-auto=validate garante que a entidade bate com o schema real
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway — baseline na versão 1 porque o schema já existe (criado via Supabase MCP)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema pre-existente gerenciado pelo Supabase MCP
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Supabase — JWT via HS256 (symmetric secret)
supabase.project-id=avugtvhjgtlcilumrvmr
supabase.issuer-uri=https://${supabase.project-id}.supabase.co/auth/v1
supabase.jwt-secret=${SUPABASE_JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs
